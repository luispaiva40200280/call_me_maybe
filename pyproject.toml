[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in LLMs using constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "lpaiva" }
]
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "accelerate>=0.26.0",
    "llm-sdk",
]

# Below [project]:
[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true